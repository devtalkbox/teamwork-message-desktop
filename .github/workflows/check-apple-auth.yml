name: Diagnose Apple authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate:
    runs-on: macos-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: yarn
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - name: Check credentials with Apple (no upload)
        run: node scripts/check-apple-auth.js
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_TYPE: ${{ vars.APPLE_API_KEY_TYPE || 'team' }}
