name: Release macOS

on:
  push:
    tags:
      - 'v*'
      # Staging tags are built by a manual run instead, otherwise pushing one
      # would start a production build that fails the channel check.
      - '!v*-staging.*'
  # A manual run picks the channel, which selects both the GitHub environment
  # (its own certificate, notarization key and reviewers) and the server the
  # packaged app points at.
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel — which server the package talks to'
        type: choice
        options:
          - staging
          - production
        default: staging
      tag:
        description: 'Existing tag to build, e.g. v5.2.0 (production) or v5.2.0-staging.1 (staging)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-sign-notarize:
    runs-on: macos-latest
    # Each environment holds its own signing certificate and notarization key.
    # Pushing a tag builds production.
    environment: ${{ inputs.channel || 'production' }}
    timeout-minutes: 90
    env:
      RELEASE_CHANNEL: ${{ inputs.channel || 'production' }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: yarn

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Verify release tag
        run: node scripts/verify-release-tag.js

      - name: Validate release credentials
        run: node scripts/validate-release-environment.js
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build, sign, and notarize macOS packages
        run: yarn release:${{ env.RELEASE_CHANNEL }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_TYPE: ${{ vars.APPLE_API_KEY_TYPE || 'team' }}
          REQUIRE_NOTARIZATION: 'true'

      - name: Verify signatures and notarization tickets
        run: |
          find dist/release -type d -name '*.app' -prune -exec codesign --verify --deep --strict --verbose=2 '{}' ';'
          find dist/release -type d -name '*.app' -prune -exec xcrun stapler validate '{}' ';'

      - name: Generate SHA-256 checksums
        run: |
          cd dist/release
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          )

          if [ "$RELEASE_CHANNEL" = "staging" ]; then
            # Published straight away as a pre-release, so it never becomes the
            # repository's "latest" release.
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --prerelease \
              --generate-notes \
              --title "$RELEASE_TAG (staging)"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
