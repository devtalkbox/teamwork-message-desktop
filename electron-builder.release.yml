appId: com.gaplotech.teamwork-wrapper
productName: Teamwork Wrap+
artifactName: Teamwork-${version}-${arch}.${ext}
directories:
  output: dist/release
files:
  - build/*
forceCodeSigning: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  type: distribution
  hardenedRuntime: true
  gatekeeperAssess: false
  darkModeSupport: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSCameraUsageDescription: Teamwork uses the camera when you start or join a video call.
    NSMicrophoneUsageDescription: Teamwork uses the microphone for voice messages and calls.
afterSign: scripts/notarize.js
